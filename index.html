<script>
// =====================================================================
//  QUITTING TIME — tap cubicles, get everyone on their shuttle home.
// =====================================================================
const W = 420, H = 760;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

const PAL  = ['#ff5a5f', '#3fa7ff', '#ffd23f', '#35d07f', '#a970ff', '#ff8a3d', '#ff6fcf'];
const SKIN = ['#ffe0bd', '#f1c27d', '#e0ac69', '#c68642', '#8d5524'];
const HAIR = ['#2b1d14', '#4a2f1b', '#7a4b26', '#d9a441', '#1b1b1b', '#9a9a9a', '#b5452c'];
const PHR  = ["Finally!", "Bye, Gary.", "TGIF!", "Not my problem", "Out of office", "Per my last email…",
  "Wine o'clock", "Can't stay late!", "Quiet quitting", "My cat needs me", "BUS! BUS!", "See you never",
  "Logging off", "Synergy THIS", "Unread: 412", "Circle back? No.", "Muted the group chat", "Laptop stays here",
  "Hard stop at 5", "Let's take this offline", "Blocked my calendar", "PTO tomorrow 😎"];
const RANKS = [[1, 'Intern'], [4, 'Associate'], [8, 'Senior Associate'], [13, 'Team Lead'], [19, 'Manager'],
  [26, 'Director'], [34, 'VP'], [44, 'Senior VP'], [56, 'C-Suite'], [70, 'CEO']];
const BOOSTERS = [
  { id: 'undo',   icon: '↶',  name: 'Undo',   price: 40 },
  { id: 'coffee', icon: '☕', name: 'Coffee', price: 90 },
  { id: 'chair',  icon: '🪑', name: '+Chair', price: 120 },
];
const BUSY = 172, BENCH_Y = 234, GRID_TOP = 300, GRID_H = 366, BOOST_Y = 712, MAX_CHAIRS = 9;
const FONT = 'system-ui,"Segoe UI",Roboto,sans-serif';

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeBack = t => { const c = 1.7; t = clamp(t, 0, 1) - 1; return 1 + (c + 1) * t * t * t + c * t * t; };
const rankOf = L => { let r = RANKS[0][1]; for (const [m, n] of RANKS) if (L >= m) r = n; return r; };

// ---------- Persistence ----------
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const meta = {
  level: +store.get('qt_level') || 1,
  best: +store.get('qt_best') || 0,
  coins: store.get('qt_coins') == null ? 100 : +store.get('qt_coins'),
  inv: (() => { try { return JSON.parse(store.get('qt_inv')) || null; } catch (e) { return null; } })() || { undo: 3, coffee: 2, chair: 1 },
  bus: store.get('qt_bus') || 'classic',
  owned: (() => { try { return JSON.parse(store.get('qt_owned')) || null; } catch (e) { return null; } })() || ['classic'],
  look: store.get('qt_look') || 'none',
  ownedLooks: (() => { try { return JSON.parse(store.get('qt_looks')) || null; } catch (e) { return null; } })() || ['none'],
  daily: (() => { try { return JSON.parse(store.get('qt_daily')) || null; } catch (e) { return null; } })() || { last: -9, streak: 0, best: 0 },
};
function saveMeta() {
  store.set('qt_level', meta.level); store.set('qt_best', meta.best);
  store.set('qt_coins', meta.coins); store.set('qt_inv', JSON.stringify(meta.inv));
  store.set('qt_bus', meta.bus); store.set('qt_owned', JSON.stringify(meta.owned));
  store.set('qt_look', meta.look); store.set('qt_looks', JSON.stringify(meta.ownedLooks));
  store.set('qt_daily', JSON.stringify(meta.daily));
}

// Worker looks: accessories on top of the route-colored outfit, so color matching never changes.
const WORKER_SKINS = [
  { id: 'none',   name: 'Business Casual', price: 0,   desc: 'Khakis. Lanyard. Dread.' },
  { id: 'cap',    name: 'Ball Caps',       price: 120, desc: 'Casual Friday, every day.' },
  { id: 'phones', name: 'Headphones',      price: 200, desc: 'Can\'t hear you, clocked out.' },
  { id: 'shades', name: 'Sunglasses',      price: 300, desc: 'Too cool for standup.' },
  { id: 'party',  name: 'Party Hats',      price: 450, desc: 'It\'s somebody\'s birthday.' },
  { id: 'crown',  name: 'Crowns',          price: 800, desc: 'Employee of the month. All of them.' },
];

// Bus skins. Body keeps the route color so matching still works; only the style changes.
const BUS_SKINS = [
  { id: 'classic', name: 'City Shuttle',   price: 0,   h: 60, desc: 'Gets you home. Barely.' },
  { id: 'decker',  name: 'Double Decker',  price: 150, h: 60, desc: 'Twice the bus, same commute.' },
  { id: 'camper',  name: 'Retro Camper',   price: 250, h: 60, desc: 'Surf\'s up. Email\'s down.' },
  { id: 'limo',    name: 'Stretch Limo',   price: 400, h: 48, desc: 'Expensed. Obviously.' },
  { id: 'party',   name: 'Party Bus',      price: 600, h: 60, desc: 'The happy hour starts now.' },
  { id: 'rocket',  name: 'Rocket Shuttle', price: 900, h: 56, desc: 'Zero to weekend in 3 seconds.' },
];
const skinById = id => BUS_SKINS.find(s => s.id === id) || BUS_SKINS[0];

// ---------- Audio ----------
let AC = null, muted = store.get('qt_mute') === '1';
function au() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function tone(f, d, type = 'sine', v = .15, slide = 0, when = 0) {
  if (muted) return;
  try {
    const a = au(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sfx = {
  pop()   { tone(420, .14, 'triangle', .22, 2.2); tone(900, .06, 'sine', .08, 1, .03); },
  seat(i) { tone(660 + i * 180, .1, 'sine', .12); tone(1320 + i * 360, .05, 'sine', .04, 1, .02); },
  bench() { tone(240, .09, 'triangle', .1, .8); },
  honk()  { tone(330, .14, 'square', .05); tone(415, .18, 'square', .05, 0, .15); tone(180, .35, 'sawtooth', .04, .4, .05); },
  nope()  { tone(140, .15, 'sawtooth', .07, .8); },
  combo(n){ for (let i = 0; i < 4; i++) tone(520 * Math.pow(1.26, i) * (1 + n * .07), .1, 'triangle', .1, 1, i * .05); },
  win()   { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .25, 'triangle', .14, 1, i * .09)); },
  lose()  { tone(330, .6, 'sawtooth', .08, .45); tone(247, .7, 'sawtooth', .06, .45, .15); },
  undo()  { tone(900, .18, 'sine', .12, .4); tone(600, .18, 'sine', .08, .4, .08); },
  coin(i) { tone(1200 + (i % 5) * 120, .07, 'square', .03); },
  star(i) { tone(700 * Math.pow(1.33, i), .25, 'triangle', .14, 1.5); },
  coffee(){ tone(300, .2, 'sine', .12, 2.5); tone(600, .2, 'triangle', .08, 2, .1); },
  chair() { tone(200, .08, 'square', .05); tone(260, .1, 'square', .05, 1, .09); },
};
function buzz(ms) { try { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(ms); } catch (e) {} }

// ---------- Level generation ----------
function access(g, R, C) {
  const reach = Array.from({ length: R }, () => Array(C).fill(false));
  const acc = Array.from({ length: R }, () => Array(C).fill(false));
  const q = [];
  for (let c = 0; c < C; c++) if (!g[0][c]) { reach[0][c] = true; q.push([0, c]); }
  while (q.length) {
    const [r, c] = q.shift();
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= R || nc >= C || reach[nr][nc] || g[nr][nc]) continue;
      reach[nr][nc] = true; q.push([nr, nc]);
    }
  }
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if (!g[r][c]) continue;
    if (r === 0) { acc[r][c] = true; continue; }
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nc >= 0 && nr < R && nc < C && reach[nr][nc]) { acc[r][c] = true; break; }
    }
  }
  return acc;
}

// Simulates a tap order against a shuttle sequence with the game's exact rules.
function sim(order, seq, B) {
  let bi = 0, fill = 0; const bench = [];
  const drain = () => {
    while (bi < seq.length) {
      for (let i = 0; i < bench.length && fill < 3; i++) if (bench[i] === seq[bi]) { bench.splice(i, 1); i--; fill++; }
      if (fill === 3) { bi++; fill = 0; continue; }
      break;
    }
  };
  for (const h of order) for (let k = 0; k < h.n; k++) {
    if (bi < seq.length && seq[bi] === h.color) { fill++; if (fill === 3) { bi++; fill = 0; drain(); } }
    else { bench.push(h.color); if (bench.length > B) return false; }
  }
  return bi === seq.length;
}

// Late-game difficulty knobs, in one place so they are easy to tune.
//  L20+: locked "meeting" cubicles   L25+: 6-wide boards   L30+: shuttle queue partly hidden
//  L40+: only 4 chairs                L50+: only the shuttle at the stop is visible
//  6-crowds and mystery cubicles keep ramping until L50; shuffling keeps ramping forever.
const fogFrom = L => L >= 50 ? 1 : L >= 30 ? 2 : 99;
const isBoss = L => L >= 10 && L % 10 === 0;

function genLevel(L, seed, boss = isBoss(L)) {
  const rnd = mulberry32(seed == null ? L * 7919 + 17 : seed);
  const cols = Math.min(L >= 25 ? 6 : 5, 3 + Math.floor(L / 4));
  const rows = Math.min(7, 3 + Math.floor(L / 3));
  const ncol = Math.min(PAL.length, 2 + Math.floor((L + 2) / 3));
  const B = L <= 5 ? 7 : L <= 14 ? 6 : L < 40 ? 5 : 4;
  const late = Math.max(0, Math.min(30, L - 20)) * .005;
  const big = Math.min(.3, L * .025) + late;
  const mys = (L >= 5 ? Math.min(.3, (L - 4) * .04) : 0) + late;
  const lockP = L >= 20 ? Math.min(.35, .08 + (L - 20) * .01) : 0;
  const g = [];
  for (let r = 0; r < rows; r++) {
    g.push([]);
    for (let c = 0; c < cols; c++) {
      g[r].push((r > 0 && rnd() < .12) ? null : { color: Math.floor(rnd() * ncol), n: rnd() < big ? 6 : 3, mystery: rnd() < mys, shake: 0, reveal: 0 });
    }
  }
  const tmp = g.map(r => r.slice()); const order = [];
  for (;;) {
    const acc = access(tmp, rows, cols); const list = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (tmp[r][c] && acc[r][c]) list.push([r, c]);
    if (!list.length) break;
    const [r, c] = list[Math.floor(rnd() * list.length)];
    order.push(tmp[r][c]); tmp[r][c] = null;
  }
  // Locks: a cubicle "in a meeting" opens after N total taps. N never exceeds its slot in the
  // known solution order, so the level always stays solvable.
  order.forEach((h, k) => {
    if (k >= 3 && rnd() < lockP) h.lock = Math.min(k, 2 + Math.floor(rnd() * Math.min(12, 3 + L / 8)));
  });
  const seq = [];
  for (const h of order) for (let k = 0; k < h.n / 3; k++) seq.push(h.color);
  const tries = Math.round((10 + L * 12) * (boss ? 1.6 : 1)), md = 2 + Math.floor(L / 3) + (boss ? 2 : 0);
  for (let t = 0; t < tries; t++) {
    const i = Math.floor(rnd() * seq.length), j = i + 1 + Math.floor(rnd() * md);
    if (j >= seq.length || seq[i] === seq[j]) continue;
    [seq[i], seq[j]] = [seq[j], seq[i]];
    if (!sim(order, seq, B)) [seq[i], seq[j]] = [seq[j], seq[i]];
  }
  return { grid: g, rows, cols, B, seq, order };
}

// ---------- Game state ----------
let S = null;

const dailyAvailable = () => meta.daily.last !== dayIndex() && meta.best >= 3;
// "Next goal" nudge shown on the win screen: the cheapest thing you don't own yet.
function teaser() {
  const items = BUS_SKINS.filter(k => !meta.owned.includes(k.id)).map(k => ({ n: k.name, p: k.price }))
    .concat(WORKER_SKINS.filter(k => !meta.ownedLooks.includes(k.id)).map(k => ({ n: k.name, p: k.price })))
    .sort((a, b) => a.p - b.p);
  if (!items.length) return '';
  const aff = items.filter(i => i.p <= meta.coins).pop();
  if (aff) return `You can afford ${aff.n} in the shop!`;
  return `Next unlock: ${items[0].n}, $${items[0].p - meta.coins} to go`;
}
const dayIndex = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
const dailyLevel = day => 14 + (day * 7) % 22;   // rotates between shift-14 and shift-35 difficulty

function startLevel(L, opts = {}) {
  const daily = !!opts.daily;
  const day = dayIndex();
  const lvL = daily ? dailyLevel(day) : L;
  const boss = !daily && isBoss(L);
  const lv = genLevel(lvL, daily ? day * 104729 + 7 : null, boss || daily);
  S = {
    level: L, lvL, daily, boss, opts, taps: 0, fog: fogFrom(lvL),
    grid: lv.grid, rows: lv.rows, cols: lv.cols, solution: lv.order,
    bench: Array(lv.B).fill(null),
    buses: lv.seq.map((c, i) => ({ color: c, route: 10 + ((i * 37 + L * 11) % 89), assigned: 0, seated: 0, seats: [null, null, null], x: 470 + i * 140, s: .7, state: 'q', vx: 0, bob: Math.random() * 6, wheel: 0 })),
    people: [], parts: [], texts: [], losing: 0, over: false, won: 0, revived: false,
    score: 0, combo: 0, lastDepart: -9, panel: null, t: 0, hint: L === 1, flash: 0, flashCol: '255,255,255',
    shake: 0, peak: 0, undo: [], mode: null, banner: boss || daily ? 2.2 : 1.5, btnShake: [0, 0, 0], usedUndo: 0,
  };
  S.total = lv.seq.length * 3;
  S.cell = Math.min(76, 396 / S.cols, GRID_H / S.rows);
  S.gx = (W - S.cols * S.cell) / 2;
  S.gy = GRID_TOP;
  refreshAccess(true);
}

function refreshAccess(silent) {
  S.acc = access(S.grid, S.rows, S.cols);
  for (let r = 0; r < S.rows; r++) for (let c = 0; c < S.cols; c++) {
    const h = S.grid[r][c];
    if (h && h.mystery && S.acc[r][c]) {
      h.mystery = false; h.reveal = 1;
      if (!silent) { const [x, y] = cellCenter(r, c); burst(x, y, PAL[h.color], 12, 140); tone(880, .12, 'sine', .08, 1.5); }
    }
  }
}

const cellCenter = (r, c) => [S.gx + c * S.cell + S.cell / 2, S.gy + r * S.cell + S.cell / 2];
const benchX = i => W / 2 - (S.bench.length - 1) * 21 + i * 42;
const logicalFront = () => S.buses.find(b => b.assigned < 3);
const boostX = i => W / 2 + (i - 1) * 112;

function mkPerson(color, x, y) {
  return { x, y, color, skin: pick(SKIN), hair: pick(HAIR), bag: Math.random() < .35, path: [], delay: 0,
    phase: rand(0, 6), spd: rand(440, 520), arrived: false, moving: false, hop: 0, dir: 1, fly: false };
}

function trackPeak() { const used = S.bench.filter(Boolean).length; S.peak = Math.max(S.peak, used / S.bench.length); }

function assignDest(p) {
  const f = logicalFront();
  if (f && f.color === p.color) {
    p.dest = { bus: f, seat: f.assigned++ };
    if (f.assigned === 3) resolveBench();
    return;
  }
  const slot = S.bench.indexOf(null);
  if (slot >= 0) { S.bench[slot] = p; p.dest = { slot }; trackPeak(); return; }
  p.dest = { overflow: true }; p.ox = rand(70, W - 70);
  if (!S.losing) S.losing = S.t;
}

function resolveBench() {
  for (;;) {
    const f = logicalFront(); if (!f) return;
    for (let i = 0; i < S.bench.length && f.assigned < 3; i++) {
      const p = S.bench[i];
      if (p && p.color === f.color) { S.bench[i] = null; p.dest = { bus: f, seat: f.assigned++ }; p.arrived = false; p.path = []; p.delay = rand(0, .08); p.hop = .6; }
    }
    if (f.assigned === 3) continue;
    return;
  }
}

function findPath(r0, c0) {
  if (r0 === 0) return [];
  const prev = {}, key = (r, c) => r * 100 + c, q = [[r0, c0]]; prev[key(r0, c0)] = null;
  while (q.length) {
    const [r, c] = q.shift();
    if (r === 0) {
      const path = []; let k = key(r, c);
      while (k !== key(r0, c0)) { path.unshift([Math.floor(k / 100), k % 100]); k = prev[k]; }
      return path;
    }
    for (const [dr, dc] of [[-1,0],[0,-1],[0,1],[1,0]]) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= S.rows || nc >= S.cols || S.grid[nr][nc] || key(nr, nc) in prev) continue;
      prev[key(nr, nc)] = key(r, c); q.push([nr, nc]);
    }
  }
  return [];
}

// ---------- Undo ----------
function snapshot() {
  S.undo.push({
    grid: S.grid.map(r => r.map(h => h && { ...h, shake: 0, reveal: 0 })),
    buses: S.buses.map(b => b.assigned),
    bench: S.bench.map(p => p && { color: p.color, skin: p.skin, hair: p.hair, bag: p.bag }),
    score: S.score, peak: S.peak, taps: S.taps,
  });
  if (S.undo.length > 15) S.undo.shift();
}

function doUndo() {
  const s = S.undo.pop();
  S.grid = s.grid; S.score = s.score; S.peak = s.peak; S.taps = s.taps;
  S.buses.forEach((b, i) => {
    const a = s.buses[i];
    b.assigned = a; b.seated = a;
    for (let k = 0; k < 3; k++) {
      if (k < a) { if (!b.seats[k]) b.seats[k] = { skin: pick(SKIN), hair: pick(HAIR), color: b.color }; }
      else b.seats[k] = null;
    }
    if (a < 3 && (b.state === 'leave' || b.state === 'gone')) { b.state = 'q'; b.x = -230; b.vx = 0; b.s = 1; }
  });
  S.people = [];
  S.bench = S.bench.map(() => null);
  s.bench.forEach((d, i) => {
    if (!d) return;
    const p = mkPerson(d.color, benchX(i), BENCH_Y);
    Object.assign(p, d, { dest: { slot: i }, arrived: true, hop: 1 });
    S.bench[i] = p; S.people.push(p);
  });
  S.losing = 0; S.over = false; S.panel = null; S.combo = 0; S.mode = null; S.usedUndo++;
  refreshAccess(true);
  S.flash = .35; S.flashCol = '120,190,255'; sfx.undo();
  floatText(W / 2, GRID_TOP - 40, '↶ REWIND', '#9fd2ff', 24);
}

// ---------- Actions ----------
function launch(r, c, viaCoffee) {
  snapshot();
  const h = S.grid[r][c]; S.grid[r][c] = null; S.hint = false;
  const [cx, cy] = cellCenter(r, c);
  let pts;
  if (viaCoffee) pts = [[cx, S.gy - 16]];
  else {
    pts = findPath(r, c).map(([rr, cc]) => cellCenter(rr, cc));
    const ex = pts.length ? pts[pts.length - 1][0] : cx;
    pts.push([ex, S.gy - 16]);
  }
  const crowd = [];
  for (let k = 0; k < h.n; k++) {
    const p = mkPerson(h.color, cx + rand(-8, 8), cy + rand(-4, 8));
    p.path = pts.map(([a, b]) => [a + rand(-9, 9), b + rand(-6, 6)]);
    p.delay = k * .045; p.fly = !!viaCoffee; p.hop = 1;
    S.people.push(p); crowd.push(p); assignDest(p);
  }
  burst(cx, cy, PAL[h.color], 16, 190); burst(cx, cy, '#ffffff', 8, 110);
  ring(cx, cy, PAL[h.color]);
  if (h.n === 6) { floatText(cx, cy - 26, '×6!', PAL[h.color], 26); ring(cx, cy, '#ffffff'); S.shake = Math.max(S.shake, 4); tone(300, .2, 'triangle', .14, 2.5, .05); }
  if (viaCoffee) { burst(cx, cy, '#8b5a2b', 14, 160); floatText(cx, cy - 20, '☕ Caffeinated!', '#ffd9a8', 16); sfx.coffee(); }
  sfx.pop(); buzz(12); S.shake = Math.max(S.shake, 2);
  if (Math.random() < .45) { const p = pick(crowd); S.texts.push({ follow: p, txt: pick(PHR), t: 1.8, max: 1.8, bubble: true }); }
  S.taps++;
  for (let rr2 = 0; rr2 < S.rows; rr2++) for (let cc = 0; cc < S.cols; cc++) {
    const o = S.grid[rr2][cc];
    if (o && o.lock && o.lock === S.taps) {
      const [ux, uy] = cellCenter(rr2, cc);
      o.reveal = 1; burst(ux, uy, '#ffd23f', 14, 150); ring(ux, uy, '#ffd23f');
      floatText(ux, uy - 20, 'Meeting over!', '#ffd23f', 14);
      tone(1100, .08, 'square', .05); tone(1500, .1, 'square', .05, 1, .07);
    }
  }
  refreshAccess(false);
}
const isLocked = h => h.lock && h.lock > S.taps;

function revive() {
  S.revived = true;
  const over = S.people.filter(p => p.dest && p.dest.overflow).length;
  for (let i = 0; i < Math.max(3, over); i++) S.bench.push(null);
  seatOverflow();
  S.panel = null; S.over = false;
}

function seatOverflow() {
  S.losing = 0;
  for (const p of S.people) if (p.dest && p.dest.overflow) {
    const slot = S.bench.indexOf(null);
    if (slot >= 0) { S.bench[slot] = p; p.dest = { slot }; p.arrived = false; }
    else if (!S.losing) S.losing = S.t;
  }
  resolveBench();
}

function canAfford(b) { return meta.inv[b.id] > 0 || meta.coins >= b.price; }
function consume(i) {
  const b = BOOSTERS[i];
  if (meta.inv[b.id] > 0) { meta.inv[b.id]--; saveMeta(); return true; }
  if (meta.coins >= b.price) {
    meta.coins -= b.price; saveMeta();
    floatText(boostX(i), BOOST_Y - 46, `-$${b.price}`, '#ffd23f', 16); sfx.coin(0);
    return true;
  }
  denied(i, `Need $${b.price}`);
  return false;
}
function denied(i, msg) {
  S.btnShake[i] = .35; sfx.nope();
  floatText(boostX(i), BOOST_Y - 46, msg, '#ff8a95', 15);
}

function useBooster(i) {
  const b = BOOSTERS[i];
  if (S.won) return;
  if (b.id === 'undo') {
    if (!S.undo.length) return denied(i, 'Nothing to undo');
    if (consume(i)) doUndo();
  } else if (b.id === 'coffee') {
    if (S.losing) return;
    if (S.mode === 'coffee') { S.mode = null; return; }
    if (!canAfford(b)) return denied(i, `Need $${b.price}`);
    S.mode = 'coffee'; tone(500, .1, 'triangle', .1, 1.5);
  } else if (b.id === 'chair') {
    if (S.bench.length >= MAX_CHAIRS) return denied(i, 'Room is full!');
    if (!consume(i)) return;
    S.bench.push(null); sfx.chair();
    floatText(W / 2, BENCH_Y - 40, '+1 chair', '#b6ffcf', 18);
    burst(benchX(S.bench.length - 1), BENCH_Y, '#b6ffcf', 12, 120);
    if (S.losing) { seatOverflow(); if (!S.losing) { S.panel = null; S.over = false; } }
  }
}

// ---------- Effects ----------
function burst(x, y, col, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(sp * .3, sp);
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: rand(.35, .7), max: .7, col, size: rand(2, 5), g: 300, kind: 'dot' });
  }
}
function ring(x, y, col) { S.parts.push({ x, y, vx: 0, vy: 0, life: .4, max: .4, col, size: 10, g: 0, kind: 'ring' }); }
function confetti(x, y, n) {
  for (let i = 0; i < n; i++) S.parts.push({ x: x + rand(-20, 20), y, vx: rand(-170, 170), vy: rand(-400, -120), life: rand(1, 1.8), max: 1.8, col: pick(PAL), size: rand(3, 7), g: 440, rot: rand(0, 6), vr: rand(-10, 10), kind: 'conf' });
}
function smoke(x, y) { S.parts.push({ x, y, vx: rand(20, 60), vy: rand(-30, -10), life: .6, max: .6, col: 'rgba(220,210,240,.5)', size: rand(3, 6), g: 0, kind: 'smoke' }); }
function floatText(x, y, txt, col, size = 20) { S.texts.push({ x, y, txt, col, size, t: 1.1, max: 1.1 }); }

// ---------- Update ----------
function destPos(p) {
  const d = p.dest;
  if (d.bus) { const b = d.bus; return [b.x + (40 + d.seat * 44) * b.s, BUSY - skinById(meta.bus).h * b.s + 22 * b.s]; }
  if (d.slot !== undefined) return [benchX(d.slot), BENCH_Y];
  return [p.ox, 268];
}

function showPanel(p) { p.t0 = S.t; S.panel = p; }

function update(dt) {
  S.t += dt;
  if (S.panel && S.panel.shop) {   // gameplay pauses while shopping; only effects keep moving
    for (let i = S.parts.length - 1; i >= 0; i--) { const q = S.parts[i]; q.life -= dt; if (q.life <= 0) { S.parts.splice(i, 1); continue; } q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.kind === 'conf') q.rot += q.vr * dt; }
    for (let i = S.texts.length - 1; i >= 0; i--) { const t = S.texts[i]; t.t -= dt; if (t.t <= 0) S.texts.splice(i, 1); }
    if (S.flash > 0) S.flash -= dt;
    S.lastDepart += dt;
    if (S.losing) S.losing += dt;
    if (S.won) S.won += dt;
    return;
  }
  if (!S.panel && S.banner > 0) S.banner -= dt;
  // Buses
  const active = S.buses.filter(b => b.state !== 'leave' && b.state !== 'gone');
  for (const b of S.buses) {
    b.bob += dt * 8;
    if (b.state === 'gone') continue;
    if (b.state === 'leave') {
      b.vx -= 1500 * dt; b.x += b.vx * dt; b.wheel += b.vx * dt / 9;
      if (Math.random() < .6) smoke(b.x + 170 * b.s, BUSY - 8);
      if (b.x < -260) b.state = 'gone';
      continue;
    }
    const rank = active.indexOf(b);
    const fogged = rank >= S.fog;
    if (b.fog && !fogged && b.x < W) { b.reveal = 1; tone(760, .1, 'triangle', .07, 1.4); }
    b.fog = fogged;
    if (b.reveal > 0) b.reveal = Math.max(0, b.reveal - dt * 3);
    const tx = rank === 0 ? 24 : rank === 1 ? 236 : 236 + 128 * (rank - 1);
    const ts = rank === 0 ? 1 : .7;
    const k = Math.min(1, dt * 11);
    const ox = b.x;
    b.x += (tx - b.x) * k; b.s += (ts - b.s) * k;
    b.wheel += (b.x - ox) / 9;
    if (rank === 0 && b.seated === 3 && Math.abs(b.x - tx) < 6) {
      b.state = 'leave'; b.vx = -60; sfx.honk();
      if (S.t - S.lastDepart < 2.6) S.combo++; else S.combo = 1;
      S.lastDepart = S.t;
      const pts = 30 * S.combo; S.score += pts;
      floatText(b.x + 85, BUSY - 84, '+' + pts, '#fff', 22);
      if (S.combo >= 2) {
        floatText(W / 2, 128, 'COMBO x' + S.combo + '!', PAL[(S.combo + 1) % PAL.length], 26 + Math.min(14, S.combo * 2));
        sfx.combo(S.combo); S.flash = .2; S.flashCol = '255,255,255'; S.shake = Math.min(9, 2 + S.combo * 1.5); buzz(25);
      }
      if (S.combo >= 5 && S.combo % 5 === 0) {   // every 5-chain pays out a couple of coins on the spot
        const c = 3; meta.coins += c; saveMeta();
        floatText(228, 62, `+$${c}`, '#ffd23f', 16); sfx.coin(S.combo);
      }
      confetti(b.x + 120, BUSY - 40, 10 + Math.min(20, S.combo * 4));
    }
  }
  // People
  for (let i = S.people.length - 1; i >= 0; i--) {
    const p = S.people[i];
    if (p.hop > 0) p.hop = Math.max(0, p.hop - dt * 4);
    if (p.delay > 0) { p.delay -= dt; continue; }
    const onPath = p.path.length > 0;
    const [tx, ty] = onPath ? p.path[0] : destPos(p);
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    const sp = p.spd * dt * (p.fly && onPath ? .8 : 1);
    if (d <= sp || d < .5) {
      p.x = tx; p.y = ty;
      if (onPath) { p.path.shift(); if (!p.path.length) p.fly = false; continue; }
      p.moving = false;
      if (!p.arrived) {
        p.arrived = true;
        if (p.dest.bus) {
          const b = p.dest.bus; b.seats[p.dest.seat] = { skin: p.skin, hair: p.hair, color: p.color, pop: 1 }; b.seated++;
          sfx.seat(b.seated - 1); burst(p.x, p.y, PAL[p.color], 6, 80);
          S.score += 5; S.people.splice(i, 1);
        } else if (p.dest.slot !== undefined) { sfx.bench(); p.hop = 1; }
        else { sfx.nope(); }
      }
    } else {
      p.x += dx / d * sp; p.y += dy / d * sp; p.moving = true; p.phase += dt * 24;
      if (Math.abs(dx) > 1) p.dir = dx < 0 ? -1 : 1;
    }
  }
  for (const b of S.buses) for (const st of b.seats) if (st && st.pop > 0) st.pop = Math.max(0, st.pop - dt * 4);
  for (const row of S.grid) for (const h of row) if (h) { if (h.shake > 0) h.shake -= dt; if (h.reveal > 0) h.reveal -= dt * 2; }
  for (let i = 0; i < 3; i++) if (S.btnShake[i] > 0) S.btnShake[i] -= dt;
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const q = S.parts[i]; q.life -= dt; if (q.life <= 0) { S.parts.splice(i, 1); continue; }
    q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.kind === 'conf') { q.rot += q.vr * dt; q.vx *= .99; }
    if (q.kind === 'smoke') q.size += dt * 14;
    if (q.kind === 'ring') q.size += dt * 160;
  }
  for (let i = S.texts.length - 1; i >= 0; i--) { const t = S.texts[i]; t.t -= dt; if (t.t <= 0) S.texts.splice(i, 1); }
  if (S.flash > 0) S.flash -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 30);

  // Lose
  if (S.losing && !S.panel && S.t - S.losing > 1.3) {
    S.over = true; sfx.lose(); buzz([40, 60, 40]);
    const btns = [];
    if (S.undo.length) btns.push({ label: meta.inv.undo > 0 ? `↶ Undo last tap (${meta.inv.undo} left)` : `↶ Undo last tap ($${BOOSTERS[0].price})`, fn: () => { if (consume(0)) doUndo(); }, primary: true });
    if (!S.revived) btns.push({ label: '🪑 Expense more chairs (free, 1×)', fn: revive, primary: !S.undo.length });
    btns.push({ label: 'Retry shift', fn: () => startLevel(S.level, S.opts) });
    showPanel({ title: 'Break room overflow!', sub: 'HR has concerns. So does the fire marshal.', btns });
  }
  // Win
  if (!S.won && !S.losing && S.people.length === 0 && S.buses.every(b => b.state === 'gone') && S.grid.every(r => r.every(h => !h))) {
    S.won = S.t; sfx.win(); buzz(30); confetti(W / 2, 320, 80);
    let stars = S.peak <= .5 ? 3 : S.peak <= .8 ? 2 : 1;
    if (S.revived) stars = Math.min(stars, 2);
    let earned = 10 + stars * 10 + Math.min(30, Math.floor(S.score / 150));
    let promoted = false, gift = null, streak = 0, perfect = S.peak === 0;
    if (perfect) earned += 25;
    if (S.daily) {
      const d = meta.daily, today = dayIndex();
      streak = d.last === today - 1 ? d.streak + 1 : d.last === today ? d.streak : 1;
      earned = 60 + Math.min(streak, 7) * 15 + stars * 10;
      meta.daily = { last: today, streak, best: Math.max(d.best || 0, streak) };
      gift = pick(BOOSTERS); meta.inv[gift.id]++;
    } else {
      if (S.boss) earned *= 2;
      promoted = rankOf(S.level + 1) !== rankOf(S.level);
      if (promoted) earned += 100;
      meta.level = S.level + 1; meta.best = Math.max(meta.best, S.level);
      if (S.level % 3 === 0 || S.boss) { gift = pick(BOOSTERS); meta.inv[gift.id]++; }
    }
    meta.coins += earned;
    saveMeta();
    S.pendingWin = { stars, earned, promoted, gift, streak, perfect };
  }
  if (S.won && !S.panel && S.t - S.won > .9) {
    const w = S.pendingWin;
    let sub = w.stars === 3 ? 'Flawless. Nobody even saw the break room.' : w.stars === 2 ? 'Solid shift. Mild break room congestion.' : 'Everyone got home… eventually.';
    if (w.perfect) sub = 'PERFECT SHIFT! Break room untouched. +$25 bonus.';
    let extra = '';
    if (S.daily) extra = `🔥 Daily streak: ${w.streak} day${w.streak === 1 ? '' : 's'}`;
    else if (w.promoted) extra = `🎉 PROMOTED to ${rankOf(S.level + 1)}! +$100`;
    else if (S.boss) extra = '📈 Review passed: double pay!';
    if (w.gift) extra += (extra ? '   ' : '') + `🎁 +1 ${w.gift.icon}`;
    const btns = S.daily
      ? [{ label: `Back to Shift ${meta.level} ▶`, fn: () => startLevel(meta.level), primary: true }, { label: 'Perks Shop', fn: openShop }]
      : [{ label: `Next shift ▶`, fn: () => startLevel(S.level + 1), primary: true }, { label: 'Perks Shop', fn: openShop }];
    if (!S.daily && dailyAvailable()) btns.splice(1, 0, { label: '🔥 Daily Shift (bonus pay)', fn: () => startLevel(meta.level, { daily: true }) });
    showPanel({ title: S.daily ? 'Daily shift done!' : S.boss ? 'Review passed!' : 'Shift complete!', sub, stars: w.stars, coins: w.earned, extra, teaser: teaser(),
      btns });
    for (let i = 0; i < w.stars; i++) sfx.star && setTimeout(() => sfx.star(i), 350 + i * 250);
  }
}

// ---------- Drawing helpers ----------
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); }
function txt(s, x, y, size, col, align = 'center', weight = 800) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function otxt(s, x, y, size, col, stroke = 'rgba(25,15,45,.8)', lw = 4, align = 'center') {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function starShape(x, y, r, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.lineWidth = 3; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.stroke(); }
}

const SKY = (() => {
  const r = mulberry32(99), b = []; let x = -10;
  while (x < W + 20) { const w = 26 + r() * 40, h = 34 + r() * 76; b.push({ x, w, h, lit: Array.from({ length: 16 }, () => r() < .4), ant: r() < .25 }); x += w + 3; }
  const back = []; x = -20;
  while (x < W + 20) { const w = 30 + r() * 50, h = 50 + r() * 70; back.push({ x, w, h }); x += w - 4; }
  const clouds = Array.from({ length: 5 }, () => ({ x: r() * W, y: 30 + r() * 60, s: .6 + r() * .7, v: 4 + r() * 8 }));
  const stars = Array.from({ length: 26 }, () => ({ x: r() * W, y: r() * 80, p: r() * 6 }));
  return { b, back, clouds, stars };
})();

function cloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,220,220,.35)';
  ctx.beginPath(); ctx.arc(x, y, 12 * s, 0, 7); ctx.arc(x + 14 * s, y - 6 * s, 15 * s, 0, 7); ctx.arc(x + 30 * s, y, 12 * s, 0, 7); ctx.fill();
  ctx.fillRect(x, y, 30 * s, 12 * s);
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, BUSY);
  g.addColorStop(0, '#3a2c78'); g.addColorStop(.45, '#c8608a'); g.addColorStop(.85, '#ffab6e'); g.addColorStop(1, '#ffd08a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, BUSY);
  for (const s of SKY.stars) { ctx.globalAlpha = .3 + .3 * Math.sin(S.t * 2 + s.p); circle(s.x, s.y, 1, '#fff'); }
  ctx.globalAlpha = 1;
  // sun
  const sg = ctx.createRadialGradient(300, BUSY - 40, 5, 300, BUSY - 40, 80);
  sg.addColorStop(0, 'rgba(255,240,170,.95)'); sg.addColorStop(.35, 'rgba(255,200,120,.5)'); sg.addColorStop(1, 'rgba(255,160,120,0)');
  ctx.fillStyle = sg; ctx.fillRect(200, BUSY - 130, 200, 130);
  circle(300, BUSY - 40, 24, '#fff0b0');
  for (const c of SKY.clouds) cloud(((c.x + S.t * c.v) % (W + 80)) - 60, c.y, c.s);
  // back skyline
  ctx.fillStyle = 'rgba(110,60,120,.75)';
  for (const b of SKY.back) ctx.fillRect(b.x, BUSY - b.h, b.w, b.h);
  // front skyline
  for (const b of SKY.b) {
    ctx.fillStyle = '#36275a'; ctx.fillRect(b.x, BUSY - b.h, b.w, b.h);
    if (b.ant) { ctx.fillRect(b.x + b.w / 2 - 1, BUSY - b.h - 12, 2, 12); circle(b.x + b.w / 2, BUSY - b.h - 12, 2, Math.sin(S.t * 3 + b.x) > 0 ? '#ff5a5f' : '#6a2b3a'); }
    let k = 0;
    for (let yy = BUSY - b.h + 7; yy < BUSY - 16; yy += 11) for (let xx = b.x + 5; xx < b.x + b.w - 6; xx += 9) {
      if (b.lit[k++ % 16]) { ctx.fillStyle = 'rgba(255,214,120,.7)'; ctx.fillRect(xx, yy, 4, 5); }
    }
  }
  // street
  ctx.fillStyle = '#29223d'; ctx.fillRect(0, BUSY - 2, W, 26);
  ctx.fillStyle = 'rgba(255,230,150,.35)';
  for (let x = -((S.t * 40) % 40); x < W; x += 40) ctx.fillRect(x, BUSY + 11, 20, 3);
  ctx.fillStyle = '#5a4d80'; ctx.fillRect(0, BUSY + 24, W, 5);
  // lobby floor
  const fg = ctx.createLinearGradient(0, BUSY + 29, 0, H);
  fg.addColorStop(0, '#4a3a78'); fg.addColorStop(.4, '#2f2550'); fg.addColorStop(1, '#1a1430');
  ctx.fillStyle = fg; ctx.fillRect(0, BUSY + 29, W, H - BUSY - 29);
  ctx.strokeStyle = 'rgba(255,255,255,.03)'; ctx.lineWidth = 1;
  for (let x = -H; x < W; x += 28) { ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + H - BUSY, BUSY + 29); ctx.stroke(); }
}

// ---------- Entities ----------
// (x, y) = head center, r = head radius
function drawAccessory(x, y, r, dir, col, kind, ph = 0) {
  if (!kind || kind === 'none') return;
  if (kind === 'cap') {
    ctx.fillStyle = shade(col, -.3); ctx.beginPath(); ctx.arc(x, y - r * .15, r * 1.08, Math.PI, 0); ctx.fill();
    ctx.fillRect(dir > 0 ? x : x - r * 1.7, y - r * .3, r * 1.7, r * .38);
    circle(x, y - r * 1.2, r * .22, shade(col, .3));
  } else if (kind === 'phones') {
    ctx.strokeStyle = '#26202f'; ctx.lineWidth = r * .38; ctx.beginPath(); ctx.arc(x, y - r * .1, r * 1.08, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    for (const sx of [-1, 1]) { circle(x + sx * r * 1.02, y + r * .1, r * .5, '#26202f'); circle(x + sx * r * 1.02, y + r * .1, r * .28, shade(col, .2)); }
  } else if (kind === 'shades') {
    ctx.fillStyle = '#111'; rr(x - r * .95 + dir * r * .2, y - r * .1, r * 1.9, r * .55, r * .2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(x - r * .55 + dir * r * .2, y - r * .02, r * .3, r * .15);
  } else if (kind === 'party') {
    const tip = [x + dir * r * .25, y - r * 2.6];
    ctx.save(); ctx.beginPath(); ctx.moveTo(x - r * .75, y - r * .65); ctx.lineTo(x + r * .75, y - r * .65); ctx.lineTo(tip[0], tip[1]); ctx.closePath();
    ctx.fillStyle = shade(col, .35); ctx.fill(); ctx.clip();
    ctx.fillStyle = shade(col, -.25);
    for (let i = 0; i < 4; i++) ctx.fillRect(x - r, y - r * (1 + i * .55), r * 2, r * .22);
    ctx.restore();
    circle(tip[0], tip[1], r * .32, '#fff');
  } else if (kind === 'crown') {
    const b = y - r * .55, t = y - r * 1.75;
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(x - r * .95, b);
    ctx.lineTo(x - r * .95, t + r * .3); ctx.lineTo(x - r * .48, b - r * .55); ctx.lineTo(x, t); ctx.lineTo(x + r * .48, b - r * .55);
    ctx.lineTo(x + r * .95, t + r * .3); ctx.lineTo(x + r * .95, b); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b88a00'; ctx.lineWidth = Math.max(.6, r * .12); ctx.stroke();
    circle(x, b - r * .3, r * .2, '#ff5a5f');
    if (Math.sin(S.t * 4 + ph) > .8) circle(x + r * .5, t + r * .2, r * .18, '#fff');
  }
}

function drawPerson(p) {
  const run = p.moving, sw = run ? Math.sin(p.phase) * 4.5 : 0, dir = p.dir || 1;
  let y = p.y - (run ? Math.abs(Math.sin(p.phase)) * 3 : 0) - p.hop * 7;

  ctx.fillStyle = '#fff'; ctx.fillRect(x - 1.5, y - 3, 3, 2);

function bodyGrad(top, h, col, lo = -.2, hi = .25) {
  const g = ctx.createLinearGradient(0, top, 0, top + h);
  g.addColorStop(0, shade(col, hi)); g.addColorStop(.5, col); g.addColorStop(1, shade(col, lo));
  return g;
}
function wheel(wx, wy, s, ang) {
  circle(wx, wy, 11 * s, '#1c1726'); circle(wx, wy, 5 * s, '#a8a1bd');
  ctx.strokeStyle = '#5d5670'; ctx.lineWidth = 1.5 * s;

}

  ctx.fillStyle = '#d7f1ff'; rr(x + 6 * s, top + 9 * s, 16 * s, h * s, 5 * s); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(x + 9 * s, top + 12 * s, 3 * s, (h - 10) * s);

// Draws a shuttle. `by` = ground line, `skinId` lets the shop preview any skin.
function drawBus(b, by = BUSY, skinId = meta.bus) {
  if (b.state === 'gone' || b.x > W + 10 || b.x < -300) return;
  const sk = skinById(skinId), id = sk.id;
  const s = b.s, x = b.x, w = (id === 'limo' ? 196 : 170) * s, h = sk.h * s;
  const leaving = b.state === 'leave';
  let bob = leaving ? Math.sin(b.bob * 2) * 1.5 : Math.sin(b.bob) * .6;
  if (id === 'rocket') bob = Math.sin(b.bob * .7) * 2.5 * s - 4 * s;
  const top = by - h + bob;
  const col = b.fog ? '#4a4363' : PAL[b.color], T = S.t;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x + w / 2, by + 7, w / 2, 5 * s, 0, 0, Math.PI * 2); ctx.fill();
  let winStyle = 'rect';

  if (id === 'classic') {
    ctx.fillStyle = '#1f1830'; rr(x + w * .3, top - 9 * s, w * .4, 11 * s, 3 * s); ctx.fill();
    txt(`${b.route} HOME`, x + w / 2, top - 3.5 * s, 7.5 * s, '#ffd23f', 'center', 900);
    ctx.fillStyle = bodyGrad(top, h, col); rr(x, top, w, h, 14 * s); ctx.fill();
    ctx.fillStyle = shade(col, -.35); ctx.fillRect(x + 4 * s, top + h - 17 * s, w - 8 * s, 6 * s);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; rr(x + 8 * s, top + 3 * s, w - 16 * s, 3 * s, 2 * s); ctx.fill();
    windshield(x, top, s);
  } else if (id === 'decker') {
    const ut = top - 32 * s;
    ctx.fillStyle = bodyGrad(ut, h + 32 * s, col); rr(x, ut, w, h + 32 * s, 14 * s); ctx.fill();
    ctx.fillStyle = shade(col, -.3); ctx.fillRect(x + 2 * s, top - 4 * s, w - 4 * s, 4 * s);
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = '#2d3a5c'; rr(x + (26 + i * 34) * s, ut + 7 * s, 28 * s, 18 * s, 4 * s); ctx.fill();
      if ((i + b.route) % 3 === 0) { circle(x + (40 + i * 34) * s, ut + 19 * s, 4.5 * s, 'rgba(255,224,189,.55)'); }
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + (28 + i * 34) * s, ut + 9 * s, 3 * s, 12 * s);
    }
    ctx.fillStyle = '#d7f1ff'; rr(x + 5 * s, ut + 7 * s, 15 * s, 18 * s, 4 * s); ctx.fill();
    ctx.fillStyle = '#1f1830'; rr(x + 4 * s, top + 4 * s, 18 * s, 5 * s, 2 * s); ctx.fill();
    txt(String(b.route), x + 13 * s, top + 6.5 * s, 5 * s, '#ffd23f', 'center', 900);
    ctx.fillStyle = shade(col, -.35); ctx.fillRect(x + 4 * s, top + h - 17 * s, w - 8 * s, 6 * s);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; rr(x + 8 * s, ut + 3 * s, w - 16 * s, 3 * s, 2 * s); ctx.fill();

  } else if (id === 'camper') {

    ctx.fillStyle = shade(col, .55); ctx.beginPath(); ctx.ellipse(x + w / 2, top - 7 * s, w * .44, 5 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = shade(col, -.2); ctx.fillRect(x + w * .1, top - 8 * s, w * .8, 2 * s);
    ctx.save(); rr(x, top, w, h, 24 * s); ctx.clip();
    ctx.fillStyle = bodyGrad(top, h, col); ctx.fillRect(x, top, w, h);
    ctx.fillStyle = '#fff4dc'; ctx.fillRect(x, top, w, h * .55);
    ctx.fillStyle = '#fff4dc'; ctx.beginPath(); ctx.moveTo(x, top + h * .5); ctx.lineTo(x + 26 * s, top + h * .5); ctx.lineTo(x + 4 * s, top + h * .92); ctx.lineTo(x, top + h * .92); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(x, top + h * .55, w, 2 * s);
    ctx.restore();
    windshield(x, top, s, 26);
    circle(x + 12 * s, top + h * .72, 5 * s, '#fff6b0'); circle(x + 12 * s, top + h * .72, 5 * s * .5, '#fff');
    ctx.strokeStyle = '#fff4dc'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.arc(x + w - 22 * s, top + h * .74, 6 * s, 0, 7); ctx.stroke();
    txt('☮', x + w - 22 * s, top + h * .74 + .5 * s, 9 * s, '#fff4dc', 'center', 900);
  } else if (id === 'limo') {
    ctx.fillStyle = bodyGrad(top, h, shade(col, -.15), -.45, .35); rr(x, top + 6 * s, w, h - 6 * s, 12 * s); ctx.fill();
    ctx.fillStyle = bodyGrad(top, h * .6, shade(col, -.1), -.3, .3); rr(x + 22 * s, top, w - 40 * s, h * .55, 10 * s); ctx.fill();
    ctx.fillStyle = '#e9e9f3'; ctx.fillRect(x + 4 * s, top + h - 14 * s, w - 8 * s, 2.5 * s);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(x + 26 * s, top + 2 * s, w - 48 * s, 2.5 * s, 1 * s); ctx.fill();
    ctx.fillStyle = '#20243a'; rr(x + 8 * s, top + 9 * s, 14 * s, 18 * s, 4 * s); ctx.fill();
    circle(x + 3 * s, top + 4 * s, 2 * s, '#e9e9f3');
    ctx.fillStyle = '#fff'; rr(x + w - 22 * s, top + h - 22 * s, 16 * s, 7 * s, 2 * s); ctx.fill();

    for (let i = 0; i < 6; i++) { const a = T * 3 + i; circle(x + w / 2 + Math.cos(a) * 4 * s, top - 12 * s + Math.sin(a * 1.3) * 4 * s, 1.5 * s, PAL[i % PAL.length]); }
    for (let i = 0; i < 7; i++) { const on = Math.floor(T * 6 + i) % 2; circle(x + (20 + i * 22) * s, top - 1 * s, 2.6 * s, on ? PAL[(i + Math.floor(T * 4)) % PAL.length] : '#3a3050'); }
    ctx.fillStyle = bodyGrad(top, h, col); rr(x, top, w, h, 14 * s); ctx.fill();
    ctx.save(); rr(x, top, w, h, 14 * s); ctx.clip();
    for (let i = 0; i < 12; i++) { ctx.fillStyle = PAL[(i + Math.floor(T * 8)) % PAL.length]; ctx.fillRect(x + i * 15 * s, top + h - 17 * s, 15 * s, 6 * s); }
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    for (let i = 0; i < 9; i++) circle(x + (14 + i * 19) * s, top + h - 5 * s, 2 * s, 'rgba(255,255,255,.25)');
    ctx.restore();

      const k = (T * .8 + i * .5) % 1;
      ctx.globalAlpha = 1 - k; txt('♪', x + w * (.35 + i * .35) + Math.sin(T * 4 + i) * 4 * s, top - 14 * s - k * 22 * s, 11 * s, PAL[(i * 3 + b.color) % PAL.length], 'center', 900); ctx.globalAlpha = 1;
    }
  } else if (id === 'rocket') {

    const fg = ctx.createLinearGradient(x + w - 6 * s, 0, x + w + fl, 0);
    fg.addColorStop(0, '#fff6b0'); fg.addColorStop(.4, '#ffb03a'); fg.addColorStop(1, 'rgba(255,80,60,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(x + w - 6 * s, top + h * .3); ctx.quadraticCurveTo(x + w + fl, top + h * .5, x + w - 6 * s, top + h * .7); ctx.fill();

    ctx.fillStyle = shade(col, -.35);
    ctx.beginPath(); ctx.moveTo(x + w - 46 * s, top + 4 * s); ctx.lineTo(x + w - 4 * s, top - 16 * s); ctx.lineTo(x + w - 6 * s, top + 14 * s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + w - 46 * s, top + h - 4 * s); ctx.lineTo(x + w - 4 * s, top + h + 12 * s); ctx.lineTo(x + w - 6 * s, top + h - 14 * s); ctx.fill();
    // body + nose cone
    ctx.fillStyle = bodyGrad(top, h, col, -.3, .4);
    ctx.beginPath(); ctx.moveTo(x + 24 * s, top); ctx.lineTo(x + w - 14 * s, top); ctx.quadraticCurveTo(x + w, top, x + w, top + 14 * s);
    ctx.lineTo(x + w, top + h - 14 * s); ctx.quadraticCurveTo(x + w, top + h, x + w - 14 * s, top + h); ctx.lineTo(x + 24 * s, top + h);
    ctx.quadraticCurveTo(x - 10 * s, top + h / 2, x + 24 * s, top); ctx.fill();
    ctx.fillStyle = '#e9e9f3'; ctx.fillRect(x + 22 * s, top + h - 12 * s, w - 30 * s, 3 * s);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; rr(x + 26 * s, top + 3 * s, w - 44 * s, 3 * s, 1.5 * s); ctx.fill();
    // hover glow instead of wheels
    const hg = ctx.createRadialGradient(x + w / 2, by + 2, 2, x + w / 2, by + 2, w / 2);
    hg.addColorStop(0, 'rgba(140,220,255,.55)'); hg.addColorStop(1, 'rgba(140,220,255,0)');

function drawBench() {
  const n = S.bench.length, used = S.bench.filter(Boolean).length, free = n - used;
  const danger = free <= 2 && used > 0;
  const x0 = benchX(0) - 27, x1 = benchX(n - 1) + 27;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(x0, BENCH_Y - 22, x1 - x0, 52, 16); ctx.fill();
  ctx.fillStyle = danger ? `rgba(255,70,90,${.22 + .15 * Math.sin(S.t * (free <= 1 ? 14 : 8))})` : 'rgba(255,255,255,.08)';
  rr(x0, BENCH_Y - 26, x1 - x0, 52, 16); ctx.fill();
  ctx.strokeStyle = danger ? 'rgba(255,120,140,.6)' : 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.stroke();
  const label = free === 0 && used ? 'BREAK ROOM FULL!' : `BREAK ROOM  ${used}/${n}`;
  txt(label, W / 2, BENCH_Y - 37, 11, danger ? '#ffb3bd' : 'rgba(255,255,255,.7)', 'center', 900);
  for (let i = 0; i < n; i++) {
    const x = benchX(i);
    ctx.fillStyle = S.bench[i] ? '#8273b0' : '#5a4d85';
    rr(x - 13, BENCH_Y + 4, 26, 8, 3); ctx.fill();
    rr(x - 13, BENCH_Y - 10, 6, 20, 2); ctx.fill();

function drawHouse(r, c, h, front) {
  const cs = S.cell, [cx, cy] = cellCenter(r, c), acc = S.acc[r][c];
  const coffee = S.mode === 'coffee';
  const pad = cs * .07, sz = cs - pad * 2, rad = sz * .18;
  const depth = acc ? 6 : 3;
  const lift = acc ? 2 + Math.sin(S.t * 4 + r * 1.1 + c * .7) * 1.4 : 0;
  const sc = 1 + (h.reveal > 0 ? h.reveal * .25 : 0);
  const sh = h.shake > 0 ? Math.sin(h.shake * 60) * 5 * h.shake / .3 : 0;
  const match = acc && !h.mystery && front && front.color === h.color;
  const col = h.mystery ? '#8a83a0' : PAL[h.color];
  const big = h.n === 6 && !h.mystery;
  ctx.save(); ctx.translate(cx + sh, cy - lift); ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(-sz / 2 + 1, -sz / 2 + depth + lift + 2, sz, sz, rad); ctx.fill();

    // stacked "second floor" peeking out above — reads as a double-size crowd
    ctx.fillStyle = acc ? shade(col, -.25) : shade(col, -.65); rr(-sz / 2 + 4, -sz / 2 - 7, sz - 8, sz, rad); ctx.fill();
    ctx.fillStyle = acc ? shade(col, .1) : shade(col, -.5); rr(-sz / 2 + 4, -sz / 2 - 9, sz - 8, 6, 3); ctx.fill();
  }
  ctx.fillStyle = acc ? shade(col, -.4) : '#2f2848'; rr(-sz / 2, -sz / 2 + depth, sz, sz, rad); ctx.fill();
  const face = ctx.createLinearGradient(0, -sz / 2, 0, sz / 2);
  if (acc) { face.addColorStop(0, '#ffffff'); face.addColorStop(1, '#e6def5'); }
  else { face.addColorStop(0, '#6a6190'); face.addColorStop(1, '#544b77'); }
  ctx.fillStyle = face; rr(-sz / 2, -sz / 2, sz, sz, rad); ctx.fill();
  ctx.save(); rr(-sz / 2, -sz / 2, sz, sz, rad); ctx.clip();
  ctx.globalAlpha = acc ? 1 : .6; ctx.fillStyle = col; ctx.fillRect(-sz / 2, -sz / 2, sz, sz * .2);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-sz / 2, -sz / 2, sz, sz * .05);
  ctx.restore(); ctx.globalAlpha = 1;
  if (h.mystery) {
    txt('?', 0, sz * .1, sz * .46, '#d8d2ee', 'center', 900);
  } else {
    const n = h.n, rowsN = n / 3, hr = rowsN > 1 ? sz * .055 : sz * .072;
    for (let k = 0; k < n; k++) {
      const row = Math.floor(k / 3), ci = k % 3;
      const hx = (ci - 1) * sz * .22, hy = -sz * .12 + row * sz * .17 - (rowsN > 1 ? sz * .06 : 0);
      const peek = acc ? Math.sin(S.t * 7 + k * 1.7 + r + c) * 1.4 : 0;
      ctx.fillStyle = acc ? col : shade(col, -.55); rr(hx - hr * 1.1, hy + peek + hr * .7, hr * 2.2, hr * 1.5, hr * .6); ctx.fill();
      circle(hx, hy + peek, hr, acc ? SKIN[(k + r * 3 + c) % SKIN.length] : '#3d3556');
      if (acc) { ctx.fillStyle = HAIR[(k * 3 + r + c) % HAIR.length]; ctx.beginPath(); ctx.arc(hx, hy + peek - hr * .15, hr * 1.05, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); }
    }
    const dw = sz * .3, dh = sz * .3;
    ctx.fillStyle = acc ? shade(col, -.1) : shade(col, -.6); rr(-dw / 2, sz / 2 - dh - sz * .05, dw, dh, 4); ctx.fill();
    circle(dw * .25, sz / 2 - dh * .5 - sz * .05, 1.8, acc ? '#fff' : '#555');
  }
  if (big) {
    const br = Math.max(11.5, sz * .23) * (acc ? 1 + .08 * Math.sin(S.t * 6 + r + c) : 1);
    const bx = sz / 2 - br * .45, by = -sz / 2 + br * .2;
    circle(bx, by + 2, br, 'rgba(0,0,0,.35)');
    circle(bx, by, br, '#fff');
    circle(bx, by, br - 2.5, acc ? col : shade(col, -.45));
    otxt('6', bx, by + 1, br * 1.25, '#fff', 'rgba(20,10,40,.55)', 3);
  }
  const locked = isLocked(h);
  if (locked) {
    // "Meeting in progress": tinted glass + padlock + taps remaining
    ctx.fillStyle = 'rgba(30,18,60,.55)'; rr(-sz / 2, -sz / 2, sz, sz, rad); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * sz * .2 - sz * .1, -sz / 2); ctx.lineTo(i * sz * .2 + sz * .1, sz / 2); ctx.stroke(); }
    const ls = Math.max(.75, sz / 62), wob = Math.sin(S.t * 3 + r + c) * .06;
    ctx.save(); ctx.translate(0, -sz * .06); ctx.rotate(wob); ctx.scale(ls, ls);

function wrapLines(s, maxW, size) {

  lines.push(line); return lines;
}

function openShop() {

function closeShop() {
  const P = S.panel;

const shopTab = tab => tab === 'people'

function buySkin(k, cx, cy, tab = 'bus') {
  const T = shopTab(tab);

  meta.coins -= k.price; T.owned.push(k.id); T.set(k.id); saveMeta();
  confetti(cx, cy, 40); sfx.win(); S.flash = .25; S.flashCol = '255,230,150';

}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

    const a = .6 + .4 * Math.sin(S.t * 5), hy = S.gy + S.rows * S.cell + 34;

    txt('Glowing color = matches the shuttle at the stop', W / 2, hy + 22, 12, 'rgba(255,255,255,.6)', 'center', 600);

  const ppl = S.people.slice().sort((a, b) => a.y - b.y);

  const shopOpen = S.panel && S.panel.shop;

  if (!S.panel && S.banner > 0) {

    const k = S.banner / bm, a = clamp(Math.min(k * 4, (1 - k) * 8), 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = S.boss ? 'rgba(90,15,35,.85)' : S.daily ? 'rgba(90,45,10,.85)' : 'rgba(20,10,40,.75)'; ctx.fillRect(0, 385, W, 110);
    const title = S.daily ? '🔥 DAILY SHIFT' : S.boss ? '⚠ PERFORMANCE REVIEW' : `SHIFT ${S.level}`;
    otxt(title, W / 2 + (1 - a) * -40, 420, S.boss ? 26 : 34, '#fff', 'rgba(20,10,40,.8)', 5);
    const sub = S.daily ? 'Same puzzle for everyone today · bonus pay' : S.boss ? `Shift ${S.level} · harder shuffle · DOUBLE PAY` : `${rankOf(S.level)} · ${S.buses.length} shuttles · ${S.bench.length} chairs`;
    txt(sub, W / 2, 452, 13, '#ffd9a8', 'center', 800);
    const notes = [];

function drawFx() {
  for (const q of S.parts) {
    const a = clamp(q.life / q.max * 1.5, 0, 1);
    ctx.globalAlpha = a; ctx.fillStyle = q.col;
    if (q.kind === 'conf') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.size / 2, -q.size / 4, q.size, q.size / 2); ctx.restore(); }
    else if (q.kind === 'ring') { ctx.strokeStyle = q.col; ctx.lineWidth = 4 * a; ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 7); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const t of S.texts) {
    const k = t.t / t.max;
    if (t.bubble) {
      const p = t.follow, x = clamp(p.x, 64, W - 64), y = p.y - 32;
      ctx.globalAlpha = Math.min(1, k * 3);
      ctx.font = `750 11px ${FONT}`; const w = ctx.measureText(t.txt).width + 16;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(x - w / 2, y - 8, w, 20, 10); ctx.fill();
      ctx.fillStyle = '#fff'; rr(x - w / 2, y - 10, w, 20, 10); ctx.fill();
      ctx.beginPath(); ctx.moveTo(p.x - 4, y + 9); ctx.lineTo(p.x + 4, y + 9); ctx.lineTo(p.x, y + 16); ctx.fill();
      txt(t.txt, x, y, 11, '#2a2342', 'center', 750);
    } else {
      ctx.globalAlpha = Math.min(1, k * 2);
      const sc = k > .85 ? easeBack((1 - k) / .15) : 1;
      ctx.save(); ctx.translate(t.x, t.y - (1 - k) * 36); ctx.scale(sc, sc);
      otxt(t.txt, 0, 0, t.size, t.col);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- Input ----------
function tap(x, y) {
  if (S.panel) {
    if (S.t - S.panel.t0 < .25) return;
    for (const r of S.panel.rects || []) if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { tone(660, .08, 'triangle', .1); r.fn(); return; }
    return;
  }
  if (y < 46 && x >= 266 && x <= 330) { openShop(); return; }
  if (y < 46 && x > W - 48) { startLevel(S.level, S.opts); return; }
  if (y < 46 && x > W - 90 && x < W - 50) { muted = !muted; store.set('qt_mute', muted ? '1' : '0'); return; }
  for (let i = 0; i < 3; i++) if (Math.hypot(x - boostX(i), y - (BOOST_Y - 6)) < 34) { useBooster(i); return; }
  if (S.losing || S.over || S.won) return;
  const c = Math.floor((x - S.gx) / S.cell), r = Math.floor((y - S.gy) / S.cell);
  if (r < 0 || c < 0 || r >= S.rows || c >= S.cols) { if (S.mode) S.mode = null; return; }
  const h = S.grid[r][c]; if (!h) return;
  if (isLocked(h)) {
    h.shake = .3; sfx.nope();
    const [lx, ly] = cellCenter(r, c);
    const n = h.lock - S.taps;
    floatText(lx, ly - 24, `In a meeting · ${n} more tap${n === 1 ? '' : 's'}`, '#ffd9a8', 13);
    return;
  }
  if (S.mode === 'coffee') {
    S.mode = null;
    if (S.acc[r][c]) { launch(r, c, false); return; }   // free: no coffee needed
    if (consume(1)) launch(r, c, true);
    return;
  }
  if (S.acc[r][c]) launch(r, c, false);
  else { h.shake = .3; sfx.nope(); }
}
cv.addEventListener('pointerdown', e => {
  const b = cv.getBoundingClientRect();
  try { const a = au(); if (a.state === 'suspended') a.resume(); } catch (err) {}
  tap((e.clientX - b.left) / scale, (e.clientY - b.top) / scale);
});
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'z' || e.key === 'u') { if (!S.panel) useBooster(0); } });

// ---------- Boot ----------
startLevel(meta.level);
showPanel({
  title: 'QUITTING TIME', big: true,
  sub: "It's 5 PM. Tap cubicles to release the workers. Get each one on their color's shuttle. Wrong color? They wait in the break room, and it's tiny.",
  extra: meta.best ? `Best: Shift ${meta.best} · ${rankOf(meta.best)}` : '',
  teaser: meta.best >= 3 ? teaser() : '',
  btns: [{ label: meta.level > 1 ? `Clock out · Shift ${meta.level} ▶` : 'Clock out ▶', fn: () => { S.panel = null; }, primary: true }]
    .concat(dailyAvailable() ? [{ label: `🔥 Daily Shift${meta.daily.streak && meta.daily.last === dayIndex() - 1 ? ` · keep your ${meta.daily.streak}-day streak` : ' (bonus pay)'}`, fn: () => startLevel(meta.level, { daily: true }) }] : [])
    .concat(meta.level > 1 ? [{ label: 'Perks Shop', fn: openShop }, { label: 'Start over from Shift 1', fn: () => { meta.level = 1; saveMeta(); startLevel(1); } }] : []),
});
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.__qt = { get S() { return S; }, tap, startLevel, sim, genLevel, meta, useBooster, step(sec) { for (let i = 0; i < sec * 60; i++) update(1 / 60); draw(); } };
</script>
</body>
